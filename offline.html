<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Arcade is offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-color: #f2f6fb;
      background-image:
        linear-gradient(#dce6f1 1px, transparent 1px),
        linear-gradient(90deg, #dce6f1 1px, transparent 1px);
      background-size: 24px 24px;
      color: #16233b;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 400px;
      padding: 24px 20px;
      background: #fff;
      border: 1.5px solid #22304a;
      border-radius: 8px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { color: #47587a; line-height: 1.5; margin-bottom: 18px; }
    button {
      width: 100%;
      min-height: 46px;
      background: #2349c9;
      color: #fff;
      border: 1.5px solid #22304a;
      border-radius: 6px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>No internet right now</h1>
    <p>This page could not be loaded and there is no saved copy yet. Connect once and open Mini Arcade, after that it works offline.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
