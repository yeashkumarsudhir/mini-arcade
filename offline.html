<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Mini Arcade</title>
  <style>
    :root {
      --bg: #0e1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-sub: #8b949e;
      --accent: #2f81f7;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .offline-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px 20px;
      max-width: 380px;
      width: 100%;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      color: var(--text-sub);
      font-size: 0.85rem;
      line-height: 1.45;
      margin-bottom: 20px;
    }
    .retry-btn {
      height: 38px;
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.85rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <h1>You're Offline</h1>
    <p>Internet connection nahi mil raha hai. Saved local cache se khelne ke liye reload dabayein.</p>
    <button class="retry-btn" onclick="window.location.reload()">Reload Page</button>
  </div>
</body>
</html>
