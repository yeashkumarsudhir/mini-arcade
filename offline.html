<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Arcade Engine Pro — Signal Severed</title>
  <style>
    :root {
      --bg-0: #050814;
      --neon-pink: #ff007f;
      --neon-cyan: #00f0ff;
      --text-main: #f0f6fc;
      --text-sub: #94a3b8;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-0);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: rgba(14, 22, 42, 0.85);
      border: 2px solid var(--neon-pink);
      border-radius: 20px;
      padding: 36px 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 0, 127, 0.3);
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.4rem;
      letter-spacing: 2px;
      color: var(--neon-pink);
      margin-bottom: 12px;
    }
    p {
      color: var(--text-sub);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .retry-btn {
      height: 44px;
      width: 100%;
      background: linear-gradient(135deg, var(--neon-cyan), #0077ff);
      color: #050814;
      font-weight: 800;
      letter-spacing: 1.5px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon">📡</div>
    <h1>CARRIER LOST</h1>
    <p>Telemetry uplink severed. The local standalone engine core is preserved in application cache.</p>
    <button class="retry-btn" onclick="window.location.reload()">RESTORE TELEMETRY</button>
  </div>
</body>
</html>
