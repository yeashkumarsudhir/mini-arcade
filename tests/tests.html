<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini Arcade tests</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; max-width: 760px; margin: 0 auto; color: #16233b; }
    h1 { margin-bottom: 12px; }
    .row { display: flex; justify-content: space-between; gap: 16px; padding: 6px 0; border-bottom: 1px solid #dce6f1; font-size: 0.92rem; }
    .pass { color: #2c7a4b; font-weight: 700; }
    .fail { color: #c23b3b; font-weight: 700; }
    #summary { margin: 16px 0; padding: 12px; border: 1.5px solid #22304a; border-radius: 6px; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Mini Arcade tests</h1>
  <p>Open this page through a local server (modules do not load from file://), for example <code>python -m http.server</code>.</p>
  <div id="summary">Running...</div>
  <div id="results"></div>

  <script type="module">
    import { runLudoTests } from './ludo-rules.test.js';

    const results = runLudoTests();
    const failed = results.filter(r => !r.pass);

    document.getElementById('summary').textContent =
      failed.length === 0 ? `All ${results.length} tests passed` : `${failed.length} of ${results.length} tests failed`;

    // failures first, so they are the first thing you see
    const rows = [...failed, ...results.filter(r => r.pass)];
    document.getElementById('results').innerHTML = rows.map(r => `
      <div class="row"><span>${r.name}</span><span class="${r.pass ? 'pass' : 'fail'}">${r.pass ? 'pass' : 'FAIL'}</span></div>
    `).join('');
  </script>
</body>
</html>
