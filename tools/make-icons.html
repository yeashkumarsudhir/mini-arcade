<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Make the app icons</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; }
    canvas { border: 1px solid #ccc; margin: 8px 8px 8px 0; }
    a { display: block; margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>App icons</h1>
  <p>Draws icons/icon.svg and icons/icon-maskable.svg as PNG. Right-click a link and save it into the icons folder with the name shown.</p>
  <div id="out"></div>

  <script>
    const jobs = [
      { svg: '../icons/icon.svg', size: 192, name: 'icon-192.png' },
      { svg: '../icons/icon.svg', size: 512, name: 'icon-512.png' },
      { svg: '../icons/icon-maskable.svg', size: 512, name: 'maskable-512.png' }
    ];

    for (const job of jobs) {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = job.size;
        canvas.getContext('2d').drawImage(img, 0, 0, job.size, job.size);

        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/png');
        link.download = job.name;
        link.textContent = `Download ${job.name}`;

        const out = document.getElementById('out');
        out.append(canvas, link);
      };
      img.src = job.svg;
    }
  </script>
</body>
</html>
